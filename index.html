<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 禁止浏览器/CDN 缓存本页，确保每次打开都是最新版本 -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>厦门国际会议中心酒店 | XIAMEN INTERNATIONAL CONFERENCE CENTER HOTEL</title>
<meta name="description" content="中国东南沿海超大型豪华会议宴会兼具滨海商务休闲度假酒店，2017金砖厦门会晤主场馆核心区酒店，雄踞环岛路，直面厦金海岸一线豪华海景。">
<style>
  :root{
    --ink:#0d1b2a;
    --ink-2:#16283d;
    --gold:#c9a56a;
    --gold-light:#e2c795;
    --gold-soft:#d9bd8f;
    --paper:#faf8f4;
    --white:#ffffff;
    --text:#2b3a4a;
    --text-soft:#6b7a8a;
    --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    font-family:var(--sans);
    background:#0a1420;
    color:var(--text);
    display:flex;justify-content:center;
    min-height:100vh;
  }
  .app{
    width:100%;max-width:480px;
    background:var(--paper);
    min-height:100vh;position:relative;
    overflow-x:hidden;
    box-shadow:0 0 60px rgba(0,0,0,.45);
  }

  /* ---------- 顶栏 ---------- */
  .topbar{
    position:fixed;top:0;left:50%;transform:translateX(-50%);
    width:100%;max-width:480px;z-index:60;
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 20px;
    background:linear-gradient(to bottom,rgba(10,20,32,.55),rgba(10,20,32,0));
    transition:background .35s ease,padding .35s ease;
  }
  .topbar.scrolled{background:rgba(13,27,42,.92);padding:11px 20px;backdrop-filter:blur(12px);}
  .topbar .brand{font-family:var(--serif);color:#fff;font-size:16px;letter-spacing:.14em;font-weight:600;opacity:0;transition:opacity .3s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .topbar.scrolled .brand{opacity:1;}
  .topbar .lang{color:rgba(255,255,255,.85);font-size:11px;letter-spacing:.2em;border:1px solid rgba(255,255,255,.35);padding:3px 10px;border-radius:999px;flex:none;background:transparent;cursor:pointer;font-family:inherit;transition:background .2s,color .2s;}
  .topbar .lang:active{background:rgba(255,255,255,.18);}
  .topbar .lang.active{background:rgba(255,255,255,.25);color:#fff;border-color:rgba(255,255,255,.65);}
  /* 子板块页左上角"返回首页"按钮（会场/MICE/婚礼/品牌简介）；显示时让出 brand 位避免拥挤 */
  .tb-back{display:none;align-items:center;gap:5px;flex:none;margin-right:10px;border:1px solid rgba(255,255,255,.38);background:rgba(13,27,42,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;font-family:var(--sans);font-size:11.5px;letter-spacing:.14em;padding:5px 12px 5px 9px;border-radius:999px;cursor:pointer;font-weight:500;box-shadow:0 4px 14px rgba(13,27,42,.3);}
  .tb-back svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .topbar.can-back .tb-back{display:inline-flex;}
  .topbar.can-back .brand{display:none;}

  /* ---------- 页面切换 ---------- */
  .page{display:none;padding-bottom:96px;}
  .page.active{display:block;animation:pageIn .55s cubic-bezier(.22,.61,.36,1);}
  @keyframes pageIn{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}

  /* 大板块下拉回首页手势：顶部提示 + 页面 translateY 跟随 */
  .pull-hint{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0);z-index:60;pointer-events:none;display:flex;flex-direction:column;align-items:center;padding-top:14px;opacity:0;transition:opacity .18s ease,transform .18s ease;transform:translateY(-6px);color:rgba(255,255,255,.85);}
  .pull-hint.show{opacity:1;transform:translateY(0);}
  .pull-hint .ph-line{width:22px;height:1px;background:rgba(255,255,255,.7);margin-bottom:7px;transition:width .18s ease;}
  .pull-hint .ph-text{font-size:10px;letter-spacing:.34em;text-transform:uppercase;font-family:var(--sans);text-shadow:0 1px 6px rgba(0,0,0,.35);}
  .pull-hint.ready .ph-line{width:38px;background:var(--gold-soft);}
  .pull-hint.ready .ph-text{color:var(--gold-soft);text-shadow:0 1px 8px rgba(0,0,0,.5);}

  /* ---------- 首页 Hero（图片 + 底部叠加标题） ---------- */
  .hero{position:relative;background:#0d1b2a;}
  .hero-photo{position:relative;height:78vh;min-height:540px;max-height:680px;overflow:hidden;}
  .hero-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 38%;
    animation:heroZoom 20s ease-out forwards, heroFade 1.6s ease-out forwards;}
  .hero-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,16,28,.08) 0%,rgba(8,16,28,0) 35%,rgba(8,16,28,.55) 72%,rgba(8,16,28,.78) 100%);z-index:1;}
  @keyframes heroZoom{from{transform:scale(1.12);}to{transform:scale(1);}}
  @keyframes heroFade{from{opacity:0;}to{opacity:1;}}

  /* 标题压图：底部居中叠在图片上 */
  .hero-overlay{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:0 28px 56px;color:#fff;text-align:center;}
  .hero-overlay::before{content:"";display:block;width:32px;height:1px;background:linear-gradient(to right,transparent,var(--gold-soft),transparent);margin:0 auto 22px;opacity:.85;}
  .hero-kicker{display:block;font-family:var(--sans);font-size:10px;letter-spacing:.42em;text-transform:uppercase;white-space:nowrap;
    color:var(--gold-soft);margin:0 0 18px;opacity:.92;}
  .hero-title{font-family:var(--serif);font-size:clamp(24px,7vw,30px);font-weight:600;letter-spacing:.04em;line-height:1.25;
    white-space:nowrap;margin:0;color:#fff;text-shadow:0 2px 24px rgba(8,16,28,.45);}
  .hero-sub{display:block;font-family:var(--serif);font-size:13.5px;font-weight:400;margin-top:14px;
    letter-spacing:.34em;white-space:nowrap;color:rgba(255,255,255,.9);}
  .hero-en{display:block;font-family:var(--sans);font-size:8.5px;letter-spacing:.26em;color:rgba(255,255,255,.55);margin-top:18px;
    text-transform:uppercase;}

  /* ---------- 通用区块 ---------- */
  section{padding:56px 24px;}
  .sec-label{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .sec-label .line{width:28px;height:1px;background:var(--gold);}
  .sec-label span{font-size:11px;letter-spacing:.36em;color:var(--gold);text-transform:uppercase;}
  h2.sec-title{font-family:var(--serif);font-size:26px;color:var(--ink);letter-spacing:.08em;font-weight:700;line-height:1.4;
    display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis;max-height:calc(1.4em*2);}
  .sec-desc{font-size:13.5px;line-height:2.1;color:var(--text-soft);margin-top:16px;text-align:justify;}

  .card{
    background:var(--white);border-radius:18px;overflow:hidden;
    box-shadow:0 8px 28px rgba(13,27,42,.07);
  }

  /* 首页 · 品牌简介（含 section title） */
  .home-brand{padding:62px 24px 24px;background:var(--paper);}
  .bs-head{text-align:center;margin-bottom:38px;position:relative;}
  .bs-head .bs-kicker{display:inline-flex;align-items:center;gap:14px;font-size:10px;letter-spacing:.4em;color:var(--gold);text-transform:uppercase;}
  .bs-head .bs-kicker .ln{width:36px;height:1px;background:linear-gradient(to right,transparent,var(--gold),transparent);}
  .bs-head h2{font-family:var(--serif);font-size:22px;color:var(--ink);letter-spacing:.1em;font-weight:600;margin-top:16px;}
  .bs-head .bs-en{font-size:10px;letter-spacing:.3em;color:var(--text-soft);margin-top:10px;text-transform:uppercase;}
  .hb-orn{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:22px;}
  .hb-orn .l{width:38px;height:1px;background:linear-gradient(to right,transparent,var(--gold));}
  .hb-orn .r{width:38px;height:1px;background:linear-gradient(to left,transparent,var(--gold));}
  .hb-orn i{width:5px;height:5px;background:var(--gold);transform:rotate(45deg);}
  .home-brand p{font-size:12.8px;line-height:2.2;color:var(--text-soft);text-align:justify;margin-top:18px;letter-spacing:.02em;}
  .hb-more{display:inline-flex;align-items:center;gap:8px;margin-top:26px;font-size:11.5px;letter-spacing:.26em;color:var(--gold);border-bottom:1px solid rgba(201,165,106,.55);padding-bottom:6px;cursor:pointer;}

  /* 数据亮点 */
  .stats-band{background:var(--ink);color:#fff;padding:54px 24px;margin-top:46px;position:relative;overflow:hidden;}
  .stats-band::before{content:"";position:absolute;width:340px;height:340px;border-radius:50%;border:1px solid rgba(201,165,106,.14);top:-170px;right:-170px;}
  .stats-band::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;border:1px solid rgba(201,165,106,.1);bottom:-120px;left:-110px;}
  .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;position:relative;z-index:1;}
  .stat{padding:22px 8px;text-align:center;}
  .stat .num{font-family:var(--serif);font-size:34px;color:var(--gold-soft);font-weight:700;letter-spacing:.02em;}
  .stat .num small{font-size:15px;margin-left:2px;}
  .stat .lab{font-size:11.5px;color:rgba(255,255,255,.66);letter-spacing:.18em;margin-top:6px;}
  .stat:nth-child(1){border-right:1px solid rgba(255,255,255,.09);border-bottom:1px solid rgba(255,255,255,.09);}
  .stat:nth-child(2){border-bottom:1px solid rgba(255,255,255,.09);}
  .stat:nth-child(3){border-right:1px solid rgba(255,255,255,.09);}

  /* 首页 · 三大导航卡片（全宽竖排） */
  .home-cards{padding:58px 20px 6px;}
  .card-grid{display:grid;grid-template-columns:1fr;gap:14px;}
  .nav-card{position:relative;height:212px;border-radius:18px;overflow:hidden;box-shadow:0 10px 28px rgba(13,27,42,.1);cursor:pointer;}
  .nav-card .nc-body{padding:0 20px 20px;}
  .nav-card .nc-body b{font-size:18px;letter-spacing:.12em;}
  .nav-card .nc-body .nc-kicker{font-size:10px;letter-spacing:.34em;margin-bottom:8px;}
  .nav-card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s ease;}
  .nav-card:active img{transform:scale(1.06);}
  .nav-card::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(10,20,32,.06) 28%,rgba(10,20,32,.74) 100%);}
  .nav-card .nc-arrow{position:absolute;top:13px;right:13px;z-index:2;width:26px;height:26px;border-radius:50%;border:1px solid rgba(255,255,255,.5);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;background:rgba(13,27,42,.28);backdrop-filter:blur(4px);}
  .nav-card .nc-body{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:0 16px 16px;color:#fff;}
  .nc-body .nc-kicker{font-size:9px;letter-spacing:.3em;color:var(--gold-soft);text-transform:uppercase;margin-bottom:5px;}
  .nc-body b{font-family:var(--serif);font-size:16.5px;letter-spacing:.1em;font-weight:600;display:block;}
  .nc-body span{font-size:10.5px;color:rgba(255,255,255,.75);letter-spacing:.08em;display:block;margin-top:4px;}

  /* 首页 · 底部行动区（电话 + 预约） */
  .action-band{padding:54px 20px 26px;text-align:center;}
  .action-band h3{font-family:var(--serif);font-size:21px;color:var(--ink);letter-spacing:.14em;font-weight:700;}
  .action-band .ab-sub{font-size:12px;color:var(--text-soft);letter-spacing:.1em;margin-top:10px;}
  .action-btns{display:flex;justify-content:center;margin-top:26px;}
  .btn-call{
    flex:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:15px 46px;border-radius:999px;text-decoration:none;border:none;cursor:pointer;
    background:linear-gradient(135deg,#d8b87e,#b98f52);color:#fff;
    font-size:14px;letter-spacing:.18em;font-weight:600;
    box-shadow:0 8px 22px rgba(185,143,82,.38);transition:transform .25s ease;
  }
  .btn-call svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:1.8;}
  .btn-call:active{transform:scale(.96);}
  .action-note{font-size:10.5px;color:var(--text-soft);letter-spacing:.16em;margin-top:18px;}

  .cta-band{padding:56px 20px 64px;text-align:center;}
  .cta-band .inner{background:linear-gradient(140deg,#13253a,#0d1b2a);border-radius:22px;padding:44px 26px;color:#fff;position:relative;overflow:hidden;}
  .cta-band .inner::before{content:"";position:absolute;width:200px;height:200px;border-radius:50%;border:1px solid rgba(201,165,106,.22);top:-90px;right:-70px;}
  /* 浅色版（用于品牌简介页，去掉沉重深蓝底） */
  .cta-band.cta-band--light .inner{background:linear-gradient(140deg,#faf5ec,#f1e8d6);border:1px solid rgba(201,165,106,.32);box-shadow:0 10px 30px rgba(13,27,42,.05);}
  .cta-band.cta-band--light .inner::before{border-color:rgba(201,165,106,.35);opacity:.7;}
  .cta-band.cta-band--light h3{color:var(--ink);}
  .cta-band.cta-band--light p{color:var(--text-soft);}
  .cta-band h3{font-family:var(--serif);font-size:21px;letter-spacing:.14em;font-weight:600;}
  .cta-band p{font-size:12px;color:rgba(255,255,255,.62);letter-spacing:.1em;margin-top:10px;}
  .btn-gold{
    display:inline-block;margin-top:26px;padding:13px 44px;border-radius:999px;
    background:linear-gradient(135deg,#d8b87e,#b98f52);color:#fff;
    font-size:13.5px;letter-spacing:.28em;text-indent:.28em;font-weight:600;
    box-shadow:0 8px 22px rgba(185,143,82,.4);border:none;cursor:pointer;
    transition:transform .25s ease;
  }
  .btn-gold:active{transform:scale(.96);}

  /* ---------- 品牌简介 ---------- */
  .page-head{position:relative;height:300px;overflow:hidden;}
  .page-head img{width:100%;height:100%;object-fit:cover;}
  .page-head::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(13,27,42,.45),rgba(13,27,42,.7));}
  .page-head .ph-inner{position:absolute;z-index:2;left:0;right:0;bottom:34px;padding:0 28px;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.5);}
  .page-head .ph-kicker{font-size:10.5px;letter-spacing:.4em;color:var(--gold-soft);text-transform:uppercase;margin-bottom:10px;}
  .page-head h1{font-family:var(--serif);font-size:30px;letter-spacing:.12em;font-weight:700;}
  .page-head .ph-en{font-size:10px;letter-spacing:.14em;color:rgba(255,255,255,.55);margin-top:8px;text-transform:uppercase;}

  .about-body{padding:48px 28px 8px;}
  .about-body p{font-size:14px;line-height:2.3;color:var(--text);text-align:justify;letter-spacing:.02em;}
  .about-body p+p{margin-top:18px;}

  .loc-list{padding:44px 24px 8px;display:flex;flex-direction:column;gap:12px;}
  .loc-item{display:flex;gap:16px;align-items:flex-start;background:var(--white);padding:20px 20px;border-radius:16px;box-shadow:0 6px 20px rgba(13,27,42,.05);}
  .loc-item .dot{width:34px;height:34px;flex:none;border-radius:50%;background:linear-gradient(135deg,#f6efe3,#ece0c8);display:flex;align-items:center;justify-content:center;font-family:var(--serif);color:var(--gold);font-size:15px;font-weight:700;}
  .loc-item b{display:block;font-size:14px;color:var(--ink);letter-spacing:.05em;margin-bottom:4px;font-weight:600;}
  .loc-item span{font-size:12px;color:var(--text-soft);line-height:1.8;}

  /* ---------- 会场设施 ---------- */
  .venue-list{padding:48px 20px 8px;display:flex;flex-direction:column;gap:20px;}
  .venue-card{background:var(--white);border-radius:20px;overflow:hidden;box-shadow:0 10px 30px rgba(13,27,42,.08);}
  .venue-card .v-img{position:relative;height:190px;overflow:hidden;}
  .venue-card .v-img img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease;}
  .venue-card .v-img .v-tag{position:absolute;top:14px;left:14px;background:rgba(13,27,42,.72);backdrop-filter:blur(6px);color:var(--gold-soft);font-size:10.5px;letter-spacing:.22em;padding:5px 12px;border-radius:999px;border:1px solid rgba(201,165,106,.4);}
  .venue-card .v-body{padding:22px 22px 26px;}
  .venue-card h3{font-family:var(--serif);font-size:18px;color:var(--ink);letter-spacing:.1em;display:flex;align-items:baseline;gap:10px;}
  .venue-card h3 small{font-size:11px;color:var(--gold);letter-spacing:.12em;font-family:var(--sans);}
  .venue-card p{font-size:12.5px;line-height:2;color:var(--text-soft);margin-top:10px;text-align:justify;}
  .venue-card .v-meta{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .venue-card .v-meta span{font-size:10.5px;color:var(--ink);background:#f5efe4;border:1px solid rgba(201,165,106,.3);padding:4px 10px;border-radius:6px;letter-spacing:.06em;}
  .venue-card{cursor:pointer;transition:transform .35s ease,box-shadow .35s ease;}
  .venue-card:active{transform:scale(.985);}
  .venue-card .v-more{margin-top:16px;font-size:11px;letter-spacing:.18em;color:var(--gold);display:flex;align-items:center;gap:6px;}
  .venue-card .v-more svg{width:13px;height:13px;stroke:var(--gold);fill:none;stroke-width:1.6;}

  /* ---------- 厅详情（抽屉式） ---------- */
  .vd-overlay{position:fixed;inset:0;z-index:70;background:rgba(13,27,42,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;visibility:hidden;transition:opacity .35s ease,visibility .35s ease;}
  .vd-overlay.open{opacity:1;visibility:visible;}
  .vd-sheet{position:absolute;top:0;right:0;bottom:0;width:100%;max-width:560px;background:var(--paper);overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateX(100%);transition:transform .42s cubic-bezier(.22,.61,.36,1);box-shadow:-20px 0 60px rgba(13,27,42,.18);}
  .vd-overlay.open .vd-sheet{transform:translateX(0);}
  .vd-close{position:absolute;top:max(14px,calc(env(safe-area-inset-top,0px) + 8px));left:14px;z-index:10;width:fit-content;border:none;background:rgba(13,27,42,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;font-family:var(--sans);font-size:12px;letter-spacing:.14em;padding:8px 14px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.35);font-weight:500;box-shadow:0 6px 20px rgba(13,27,42,.4);}
  .vd-close svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2;}

  /* ---------- 头图加载失败兜底 ---------- */
  .hero-photo img.img-broken,.page-head img.img-broken{opacity:0;}

  /* 头图：纯图 + 返回按钮；底部渐入米色与下方融合 */
  .vd-hero{position:relative;height:220px;overflow:hidden;background:#0d1b2a;}
  .vd-hero img{width:100%;height:100%;object-fit:cover;display:block;}
  .vd-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,27,42,.22) 0%,rgba(13,27,42,0) 28%,rgba(251,247,239,0) 55%,rgba(251,247,239,.85) 82%,rgba(251,247,239,1) 100%);pointer-events:none;}

  /* 头图外标题区：标签 + 厅名（面积在下方统计方块里） */
  .vd-title-area{padding:18px 20px 4px;background:var(--paper);}
  .vd-tag{display:inline-block;background:rgba(13,27,42,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--gold-soft);font-size:10.5px;letter-spacing:.28em;padding:5px 13px;border-radius:999px;border:1px solid rgba(201,165,106,.5);font-weight:500;margin-bottom:12px;}
  .vd-title-name{font-family:var(--serif);font-size:26px;color:var(--ink);letter-spacing:.08em;margin:0 0 4px;line-height:1.1;}

  /* 主体 */
  .vd-body{padding:18px 20px 110px;}
  .vd-tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
  .vd-tags span{font-size:11px;color:var(--ink);background:#f5efe4;border:1px solid rgba(201,165,106,.3);padding:5px 12px;border-radius:6px;letter-spacing:.06em;}

  /* 两个统计方块（参考图风格：浅米底+金边+左侧圆形图标） */
  .vd-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px;}
  .vd-stat{background:#fbf7ef;border:1px solid rgba(201,165,106,.28);border-radius:14px;padding:16px 14px;display:flex;align-items:center;gap:11px;box-shadow:0 4px 14px rgba(13,27,42,.04);}
  .vd-stat .ico{width:38px;height:38px;border-radius:50%;background:#f5efe4;display:flex;align-items:center;justify-content:center;flex:none;border:1px solid rgba(201,165,106,.28);}
  .vd-stat .ico svg{width:18px;height:18px;stroke:var(--gold);fill:none;stroke-width:1.4;}
  .vd-stat .meta{display:flex;flex-direction:column;line-height:1.2;min-width:0;}
  .vd-stat .num{font-family:var(--serif);font-size:20px;color:var(--ink);letter-spacing:.02em;font-weight:500;display:flex;align-items:baseline;gap:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .vd-stat .num em{font-style:normal;font-size:10.5px;color:var(--gold);margin-left:2px;font-family:var(--sans);letter-spacing:.06em;}
  .vd-stat .lab{font-size:10px;color:var(--text-soft);letter-spacing:.18em;margin-top:3px;}

  /* 简介 & 小节标题 */
  .vd-gtitle{font-size:11px;letter-spacing:.3em;color:var(--gold);margin:4px 0 14px;}
  .vd-desc{font-size:13.5px;line-height:2.25;color:var(--text);text-align:justify;letter-spacing:.02em;white-space:pre-line;}

  /* 图集：单列纵向，每张 16:9 统一比例 */
  .vd-gallery{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
  .vd-gallery img{width:100%;aspect-ratio:16/9;display:block;background:#eee;object-fit:cover;border-radius:12px;}

  /* ---------- 案例页 ---------- */
  .case-list{padding:48px 20px 8px;display:flex;flex-direction:column;gap:22px;}
  .case-card{background:var(--white);border-radius:20px;overflow:hidden;box-shadow:0 10px 30px rgba(13,27,42,.08);}
  .case-card .c-img{position:relative;height:210px;overflow:hidden;}
  .case-card .c-img img{width:100%;height:100%;object-fit:cover;}
  .case-card .c-img .c-no{position:absolute;bottom:-6px;right:14px;font-family:var(--serif);font-size:64px;color:rgba(255,255,255,.5);font-weight:700;line-height:1;}
  .case-card .c-body{padding:24px 22px 26px;}
  .case-card .c-tags{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .case-card .c-tags span{font-size:10px;letter-spacing:.14em;color:var(--gold);border:1px solid rgba(201,165,106,.45);padding:3px 10px;border-radius:999px;}
  .case-card h3{font-family:var(--serif);font-size:18px;color:var(--ink);letter-spacing:.08em;line-height:1.5;}
  .case-card p{font-size:12.5px;line-height:2.05;color:var(--text-soft);margin-top:10px;text-align:justify;}

  /* ---------- 案例页 · 三级结构（封面卡 → 子案例 → 详情） ---------- */
  .case-crumb{padding:18px 20px 0;display:none;}
  .case-crumb.show{display:block;}
  .crumb-btn{display:inline-flex;align-items:center;gap:6px;background:none;border:none;cursor:pointer;color:var(--gold);font-size:12.5px;letter-spacing:.14em;font-family:var(--sans);padding:0;}
  .crumb-btn svg{width:14px;height:14px;stroke:var(--gold);fill:none;stroke-width:1.8;}

  /* L1 · 六张封面卡（两列网格） */
  .case-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:30px 20px 8px;}
  .case-cover{position:relative;height:198px;border-radius:18px;overflow:hidden;box-shadow:0 10px 26px rgba(13,27,42,.1);cursor:pointer;}
  .case-cover img{width:100%;height:100%;object-fit:cover;transition:transform .7s ease;}
  .case-cover:active img{transform:scale(1.06);}
  .case-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(13,27,42,.84) 0%,rgba(13,27,42,.18) 54%,rgba(13,27,42,0) 100%);}
  .case-cover .cc-tag{position:absolute;top:12px;left:12px;z-index:2;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:var(--gold-soft);font-size:9.5px;letter-spacing:.2em;padding:4px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.35);}
  .case-cover .cc-body{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:14px 15px;color:#fff;}
  .case-cover .cc-body b{display:block;font-family:var(--serif);font-size:15px;letter-spacing:.05em;font-weight:600;line-height:1.35;text-shadow:0 1px 8px rgba(0,0,0,.4);}
  .case-cover .cc-body .cc-count{display:flex;align-items:center;gap:4px;font-size:10px;letter-spacing:.12em;color:rgba(255,255,255,.82);margin-top:7px;}
  .case-cover .cc-body .cc-count svg{width:12px;height:12px;stroke:var(--gold-soft);fill:none;stroke-width:1.7;}

  /* L2 · 分类标题块 + 子案例横向卡 */
  /* L2 子案例列表：整行横向扁卡，标题叠图上 */
  .sub-list{padding:14px 20px 8px;display:flex;flex-direction:column;gap:12px;}
  .sub-case{position:relative;border-radius:13px;overflow:hidden;cursor:pointer;aspect-ratio:3/1;background:var(--white);box-shadow:0 5px 14px rgba(13,27,42,.06);transition:transform .35s ease,box-shadow .35s ease;}
  .sub-case:active{transform:scale(.985);box-shadow:0 2px 8px rgba(13,27,42,.08);}
  .sub-case .sc-img{position:absolute;inset:0;}
  .sub-case .sc-img img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease;}
  .sub-case:active .sc-img img{transform:scale(1.04);}
  .sub-case .sc-title{
    position:absolute;left:0;right:0;bottom:0;
    padding:14px 14px 9px;
    color:#fff;
    font-family:var(--serif);
    font-size:13.5px;
    letter-spacing:.04em;
    line-height:1.4;
    font-weight:600;
    text-align:left;
    background:linear-gradient(to top, rgba(13,27,42,.72) 0%, rgba(13,27,42,.28) 55%, transparent 100%);
  }

  /* L3 · 案例详情抽屉（复用 vd 抽屉，金色基调，非浪漫粉） */
  .vd-sheet.cases .vd-tag{background:rgba(13,27,42,.78);color:var(--gold-soft);border-color:rgba(201,165,106,.5);}

  /* ---------- 婚礼婚宴 ---------- */
  .wed-list{padding:48px 20px 8px;display:flex;flex-direction:column;gap:22px;}
  .wed-card{background:var(--white);border-radius:20px;overflow:hidden;box-shadow:0 10px 30px rgba(13,27,42,.08);cursor:pointer;}
  .wed-card .w-img{position:relative;height:240px;overflow:hidden;}
  .wed-card .w-img img{width:100%;height:100%;object-fit:cover;transition:transform .7s ease;}
  .wed-card:active .w-img img{transform:scale(1.05);}
  .wed-card .w-img::after{content:"";position:absolute;inset:0;background:linear-gradient(158deg,rgba(13,27,42,.15) 0%,rgba(13,27,42,0) 45%,rgba(13,27,42,.55) 100%);pointer-events:none;}
  /* 婚宴标签 · 基础样式（封面卡片 + 详情页元信息 共用，详情页由 .romantic 上下文加 .vd-tags 容器） */
  .w-tag{display:inline-block;flex:none;color:var(--gold);font-family:var(--sans);font-size:10.5px;letter-spacing:.26em;padding:5px 14px;border-radius:999px;border:1px solid rgba(201,165,106,.55);background:rgba(255,255,255,.55);line-height:1.4;white-space:nowrap;}
  .wed-card .w-body{padding:24px 22px 26px;}
  /* 标签 + 标题 · 同行排版（标题居左、标签居右） */
  .wed-card .w-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .wed-card .w-head h3{font-family:var(--serif);font-size:18px;color:var(--ink);letter-spacing:.04em;line-height:1.45;margin:0;flex:1;min-width:0;}
  .wed-card .w-head .w-tag{flex:none;}
  .wed-card .w-body p{font-size:12.5px;line-height:2.0;color:var(--text-soft);margin-top:6px;text-align:justify;}
  .wed-card .w-more{margin-top:20px;display:inline-flex;align-items:center;gap:6px;color:var(--gold);font-size:12.5px;letter-spacing:.12em;}
  .wed-card .w-more svg{width:15px;height:15px;}

  /* 婚礼详情抽屉 · 浪漫基调（复用 vd 抽屉，仅微调标签/头图渐入色） */
  .vd-sheet.romantic .vd-tag{background:rgba(216,167,160,.92);color:#5a2a26;border-color:rgba(216,167,160,.6);}
  .vd-sheet.romantic .vd-hero::after{background:linear-gradient(180deg,rgba(216,167,160,.22) 0%,rgba(216,167,160,0) 32%,rgba(251,247,239,0) 55%,rgba(251,247,239,.7) 80%,rgba(251,247,239,1) 100%);}
  /* 婚宴详情：3 个标签 — 椭圆 + 金色底 + 白字 */
  .vd-sheet.romantic .vd-tags{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 24px;}
  .vd-sheet.romantic .vd-tags .w-tag{background:var(--gold);color:#fff;border-color:var(--gold);}

  /* ---------- 联系我们 ---------- */
  .contact-list{padding:48px 22px 8px;display:flex;flex-direction:column;gap:14px;}
  .contact-item{display:flex;gap:16px;align-items:flex-start;background:var(--white);border-radius:16px;padding:20px;box-shadow:0 6px 20px rgba(13,27,42,.05);}
  .contact-item .ci-icon{width:40px;height:40px;flex:none;border-radius:12px;background:linear-gradient(135deg,#f6efe3,#ece0c8);display:flex;align-items:center;justify-content:center;}
  .contact-item .ci-icon svg{width:19px;height:19px;stroke:var(--gold);fill:none;stroke-width:1.5;}
  .contact-item b{display:block;font-size:13.5px;color:var(--ink);letter-spacing:.06em;margin-bottom:5px;font-weight:600;}
  .contact-item span{font-size:12.5px;color:var(--text-soft);line-height:1.9;}
  .contact-item.ci-tel{text-decoration:none;color:inherit;position:relative;transition:transform .2s,box-shadow .2s;}
  .contact-item.ci-tel:active{transform:scale(.98);}
  .contact-item.ci-tel .ci-go{margin-left:auto;align-self:center;width:20px;height:20px;flex:none;}
  .contact-item.ci-tel .ci-go svg{width:18px;height:18px;stroke:var(--gold);fill:none;stroke-width:1.6;}

  .form-card{margin:36px 20px 8px;background:var(--white);border-radius:20px;padding:30px 24px;box-shadow:0 10px 30px rgba(13,27,42,.08);}
  .form-card h3{font-family:var(--serif);font-size:18px;color:var(--ink);letter-spacing:.1em;margin-bottom:6px;}
  .form-card .fc-sub{font-size:11.5px;color:var(--text-soft);letter-spacing:.06em;margin-bottom:22px;}
  .f-group{margin-bottom:16px;}
  .f-group label{display:block;font-size:11px;color:var(--text-soft);letter-spacing:.18em;margin-bottom:8px;}
  .f-group input,.f-group select{
    width:100%;padding:13px 14px;border:1px solid #e5e0d6;border-radius:12px;
    font-size:14px;color:var(--ink);background:#fdfcfa;outline:none;
    transition:border .25s;font-family:var(--sans);
  }
  .f-group input:focus,.f-group select:focus{border-color:var(--gold);}
  .f-submit{width:100%;margin-top:8px;}

  /* 关注我们 · 公众号 / 小红书 */
  .social-band{margin:30px 20px 8px;background:var(--white);border-radius:20px;padding:30px 22px 26px;box-shadow:0 10px 30px rgba(13,27,42,.08);text-align:center;}
  .social-band .sb-title{font-family:var(--serif);font-size:18px;color:var(--ink);letter-spacing:.1em;margin-bottom:4px;}
  .social-band .sb-sub{font-size:10px;color:var(--gold);letter-spacing:.3em;text-transform:uppercase;margin-bottom:24px;}
  .social-row{display:flex;justify-content:center;gap:38px;}
  .social-card{flex:none;display:flex;flex-direction:column;align-items:center;gap:10px;text-decoration:none;color:inherit;transition:transform .2s;}
  .social-card:active{transform:scale(.94);}
  .social-card .sc-ic{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.08);}
  .social-card .sc-ic svg{width:34px;height:34px;}
  .social-wechat .sc-ic{background:#07C160;color:#fff;}
  .social-redbook .sc-ic{background:#FF2442;color:#fff;}
  .social-card .sc-lb{font-size:12px;color:var(--text);letter-spacing:.04em;}
  .social-follow{font-size:13px;color:var(--text);letter-spacing:.05em;margin-top:20px;}
  .social-follow b{color:var(--ink);font-weight:600;}
  .toast{
    position:fixed;bottom:118px;left:50%;transform:translateX(-50%) translateY(20px);
    background:rgba(13,27,42,.92);color:#fff;font-size:12.5px;letter-spacing:.1em;
    padding:12px 26px;border-radius:999px;opacity:0;pointer-events:none;
    transition:opacity .35s,transform .35s;z-index:99;white-space:nowrap;
    border:1px solid rgba(201,165,106,.5);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  footer{padding:44px 26px 120px;background:var(--ink);color:rgba(255,255,255,.55);text-align:center;}
  footer .f-brand{font-family:var(--serif);font-size:16px;color:#fff;letter-spacing:.2em;}
  footer .f-en{font-size:9px;letter-spacing:.18em;color:rgba(255,255,255,.35);margin-top:8px;text-transform:uppercase;}
  footer .f-line{width:26px;height:1px;background:var(--gold);margin:20px auto;}
  footer p{font-size:11px;line-height:2;letter-spacing:.06em;}

  /* ---------- 底部导航 ---------- */
  .tabbar{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);
    width:100%;max-width:480px;z-index:60;
    display:flex;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);
    border-top:1px solid rgba(13,27,42,.08);
    padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  }
  .tab{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:6px 0;cursor:pointer;border:none;background:none;
    transition:opacity .2s;
  }
  .tab svg{width:22px;height:22px;stroke:#8a97a5;fill:none;stroke-width:1.5;transition:stroke .25s;}
  .tab span{font-size:10px;color:#8a97a5;letter-spacing:.08em;transition:color .25s;font-family:var(--sans);}
  .tab.on svg{stroke:var(--gold);}
  .tab.on span{color:var(--gold);font-weight:600;}

  /* 渐入动画 */
  .reveal{opacity:0;transform:translateY(24px);transition:opacity .8s ease,transform .8s ease;}
  .reveal.in{opacity:1;transform:translateY(0);}
</style>
</head>

      '<h2 class="sec-title reveal">' + esc(cat.title) + '</h2>' +
      '<div class="reveal" style="font-size:10px;letter-spacing:.3em;color:var(--text-soft);margin-top:10px;text-transform:uppercase;">' + esc(cat.en || '') + '</div>' +
      '<p class="sec-desc reveal">' + esc(cat.desc || '') + '</p>';
    var html = '<div class="sub-list reveal">';
    (cat.cases || []).forEach(function(sc, j){
      var cover = sc.cover != null ? sc.cover : sc.image;
      html += '<div class="sub-case reveal" data-ci="' + ci + '" data-si="' + j + '">' +
        '<div class="sc-img">' + imgTag(imgOf(cover), sc.title) + '</div>' +
        '<div class="sc-title">' + esc(sc.title) + '</div></div>';
    });
    html += '</div>';
    document.getElementById('c-list').innerHTML = html;
    window.scrollTo(0, 0);
    bindReveals();
  }

  function openCase(ci, si){
    var cat = SITE.cases.list[ci];
    var it = cat && cat.cases && cat.cases[si]; if(!it) return;
    var sheet = document.getElementById('vd-sheet');
    sheet.classList.remove('romantic');
    sheet.classList.add('cases');
    var imgs = (it.images && it.images.length) ? it.images : (it.image != null ? [it.image] : []);
    var heroImg = imgOf(it.cover != null ? it.cover : (it.image != null ? it.image : (imgs[0] != null ? imgs[0] : '')));
    document.getElementById('vd-hero').innerHTML = imgTag(heroImg, it.title);
    var titleHtml = '<h2 class="vd-title-name">' + esc(it.title) + '</h2>';
    document.getElementById('vd-title-area').innerHTML = titleHtml;
    var html = '';
    if(it.meta && it.meta.length){
      html += '<div class="vd-tags">' + '<span>' + esc(it.meta[0]) + '</span>' + '</div>';
    }
    var gal = imgs.map(imgOf).filter(Boolean);
    if(gal.length){
      html += '<div class="vd-gtitle" style="margin-top:30px;">实景图集</div><div class="vd-gallery">' +
        gal.map(function(g){ return imgTag(g, it.title); }).join('') + '</div>';
    }
    document.getElementById('vd-body').innerHTML = html;
    vdOverlay.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  document.getElementById('c-list').addEventListener('click', function(e){
    var sub = e.target.closest('.sub-case');
    if(sub){ openCase(parseInt(sub.dataset.ci, 10), parseInt(sub.dataset.si, 10)); return; }
    var cov = e.target.closest('.case-cover');
    if(cov){ renderCasesL2(parseInt(cov.dataset.ci, 10)); }
  });
  document.getElementById('c-crumb').addEventListener('click', function(e){
    if(e.target.closest('.crumb-btn')){ renderCasesL1(); }
  });

  /* 关注卡片：未配 URL 时点击复制搜索词 */
  document.getElementById('ct-form').addEventListener('click', function(e){
    var sc = e.target.closest('.social-card[data-search]');
    if(!sc) return;
    var txt = sc.getAttribute('data-search');
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(function(){ toast('已复制搜索词：' + txt); }, function(){ toast('请搜索：' + txt); });
      }else{ toast('请搜索：' + txt); }
    }catch(err){ toast('请搜索：' + txt); }
  });

  /* ---------- 数据加载 ---------- */
  fetch('site-public.json?v=' + Date.now())
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(data){
      originalData = data;
      setLang(currentLang);
    })
    .catch(function(){
      toast('内容加载异常，请刷新重试');
    });

  /* ---------- 页面切换 ---------- */
  var tabs = document.querySelectorAll('.tab');
  var pages = document.querySelectorAll('.page');
  var topbar = document.getElementById('topbar');

    /* 需要显示左上角"返回"按钮的页面：三个大板块 + 品牌简介 */
    var BACK_PAGES = ['venues', 'cases', 'weddings', 'about'];
    function goto(name){
      pages.forEach(function(p){ p.classList.toggle('active', p.id === 'page-' + name); });
      tabs.forEach(function(t){ t.classList.toggle('on', t.dataset.page === name); });
      if(topbar){ topbar.classList.toggle('can-back', BACK_PAGES.indexOf(name) >= 0); }
      if(name === 'cases' && SITE){ renderCasesL1(); }
      window.scrollTo(0,0);
      bindReveals();
    }

  tabs.forEach(function(t){
    t.addEventListener('click', function(){ goto(t.dataset.page); });
  });

  document.addEventListener('click', function(e){
    var g = e.target.closest('[data-goto]');
    if(g){ goto(g.dataset.goto); }
  });

  window.addEventListener('scroll', function(){
    topbar.classList.toggle('scrolled', window.scrollY > 60);
  });

  /* ---------- 大板块下拉回首页手势 ---------- */
  var pullStartY = 0;
  var pulling = false;
  var PULL_PAGES = ['page-venues', 'page-cases', 'page-weddings', 'page-contact'];
  var pullHint = document.getElementById('pull-hint');

  function pullActivePage(){
    var a = document.querySelector('.page.active');
    return a && PULL_PAGES.indexOf(a.id) >= 0 ? a : null;
  }
  function showPullHint(show, ready){
    if(!pullHint) return;
    pullHint.classList.toggle('show', !!show);
    pullHint.classList.toggle('ready', !!ready);
  }
  function endPull(animate, finalY, cb){
    var page = pullActivePage();
    pulling = false;
    if(!page){ showPullHint(false); if(cb) cb(); return; }
    page.style.transition = animate ? 'transform .28s cubic-bezier(.4,0,.2,1)' : 'transform .22s ease';
    page.style.transform = finalY ? 'translateY(' + finalY + 'px)' : '';
    var done = function(){
      page.style.transition = '';
      page.style.transform = '';
      showPullHint(false);
      if(cb) cb();
    };
    page.addEventListener('transitionend', function onEnd(e){
      if(e.propertyName !== 'transform') return;
      page.removeEventListener('transitionend', onEnd);
      done();
    });
    // 兜底：过渡中断时仍清状态
    setTimeout(done, 360);
  }

  window.addEventListener('touchstart', function(e){
    if(!e.touches || !e.touches[0]) return;
    if(window.scrollY > 0) return;
    if(document.getElementById('vd-overlay').classList.contains('open')) return;
    if(!pullActivePage()) return;
    var t = e.touches[0];
    if(t.clientY > 90) return; // 仅屏幕顶部 90px 内触发
    pullStartY = t.clientY;
    pulling = true;
  }, {passive: true});

  window.addEventListener('touchmove', function(e){
    if(!pulling || !e.touches || !e.touches[0]) return;
    var page = pullActivePage();
    if(!page){ pulling = false; return; }
    if(window.scrollY > 0){
      endPull(); return;
    }
    var dy = e.touches[0].clientY - pullStartY;
    if(dy <= 0){
      page.style.transform = '';
      showPullHint(false);
      return;
    }
    // 阻尼：拖 1px 移动 0.55px，最大 140px
    var damped = Math.min(dy * 0.55, 140);
    page.style.transform = 'translateY(' + damped.toFixed(1) + 'px)';
    showPullHint(damped > 36, damped > 80);
  }, {passive: true});

  window.addEventListener('touchend', function(){
    if(!pulling) return;
    var page = pullActivePage();
    if(!page){ pulling = false; showPullHint(false); return; }
    var t = page.style.transform;
    var m = t.match(/translateY\(([\d.]+)px\)/);
    var visual = m ? parseFloat(m[1]) : 0;
    // 把阻尼后位移换算成原始拖动距离作为判定（>90 ≈ 真实拖动 >90px）
    var raw = visual / 0.55;
    if(raw > 90){
      // 飞走：先往下甩出屏幕，再切首页
      endPull(true, window.innerHeight, function(){ goto('home'); });
    } else {
      endPull(true, 0, null);
    }
  });

  window.addEventListener('touchcancel', function(){
    if(pulling) endPull(true, 0, null);
  });

  /* 渐入动画 */
  var io = null;
  function bindReveals(){
    var els = document.querySelectorAll('.page.active .reveal:not(.in)');
    if(!('IntersectionObserver' in window)){
      els.forEach(function(el){ el.classList.add('in'); });
      return;
    }
    if(!io){
      io = new IntersectionObserver(function(entries){
        entries.forEach(function(en){
          if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); }
        });
      },{threshold:.12});
    }
    els.forEach(function(el){ io.observe(el); });
  }

  /* 表单 */
  function bindForm(f){
    var btn = document.getElementById('f-submit');
    if(!btn) return;
    btn.addEventListener('click', function(){
      var name = document.getElementById('f-name').value.trim();
      var phone = document.getElementById('f-phone').value.trim();
      var t = document.getElementById('toast');
      if(!name || !phone){
        t.textContent = f.error || '请填写您的称呼与联系电话';
      }else{
        t.textContent = f.success || '提交成功，宴会顾问将尽快与您联系';
        document.getElementById('f-name').value = '';
        document.getElementById('f-phone').value = '';
      }
      t.classList.add('show');
      setTimeout(function(){ t.classList.remove('show'); }, 2600);
    });
  }

  function toast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 2600);
  }
})();
</script>
</body>
</html>
