<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>关注厦门国际会议中心酒店 - 微信公众号</title>
<style>
  :root{
    --ink:#0d1b2a;--gold:#c9a56a;--gold-light:#e2c795;--paper:#faf8f4;--white:#ffffff;--text:#2b3a4a;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{font-family:var(--sans);background:var(--paper);color:var(--text);display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{width:100%;max-width:340px;background:var(--white);border-radius:24px;padding:44px 28px 36px;text-align:center;box-shadow:0 14px 40px rgba(13,27,42,.1);}
  .ic-wechat{width:72px;height:72px;border-radius:50%;background:#07C160;margin:0 auto 22px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(7,193,96,.28);}
  .ic-wechat svg{width:40px;height:40px;color:#fff;}
  h1{font-size:18px;color:var(--ink);letter-spacing:.06em;margin-bottom:10px;font-weight:600;}
  p{font-size:13px;color:var(--text);line-height:1.7;margin-bottom:28px;}
  .qr-img{width:70%;max-width:220px;border-radius:14px;box-shadow:0 8px 24px rgba(13,27,42,.12);display:block;margin:0 auto 16px;}
  .qr-tip{font-size:13px;color:var(--text);letter-spacing:.04em;line-height:1.7;margin-bottom:28px;}
  .back{display:inline-block;font-size:12px;color:var(--text);text-decoration:none;letter-spacing:.08em;padding:8px 18px;border:1px solid rgba(201,165,106,.5);border-radius:999px;transition:background .2s;}
  .back:active{background:rgba(201,165,106,.12);}
  .toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(20px);background:rgba(13,27,42,.88);color:#fff;padding:10px 22px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="card">
  <div class="ic-wechat"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M9.5 2.5C4.7 2.5 1 5.6 1 9.4c0 2.2 1.1 4.1 2.8 5.4l-.7 2.5 2.7-1.4c.9.25 1.9.4 2.9.4h.6c-.14-.5-.2-1-.2-1.6 0-3.4 3.3-6.2 7.4-6.2h.7C16.2 5.2 12.2 2.5 9.5 2.5zm-2.7 4c.6 0 1.1.5 1.1 1.1s-.5 1.1-1.1 1.1-1.1-.5-1.1-1.1.5-1.1 1.1-1.1zm5.4 0c.6 0 1.1.5 1.1 1.1s-.5 1.1-1.1 1.1-1.1-.5-1.1-1.1.5-1.1 1.1-1.1z"/><path fill="currentColor" d="M23 13.8c0-3-2.9-5.4-6.5-5.4s-6.5 2.4-6.5 5.4 2.9 5.4 6.5 5.4c.8 0 1.5-.1 2.2-.3l2.1 1.1-.6-1.8c1.7-.9 2.8-2.4 2.8-4.4zm-6.5 1.5c-.5 0-1-.5-1-1s.5-1 1-1 1 .5 1 1-.5 1-1 1zm3.6 0c-.5 0-1-.5-1-1s.5-1 1-1 1 .5 1 1-.5 1-1 1z"/></svg></div>
  <h1>关注 厦门国际会议中心酒店</h1>
  <p>请使用微信扫描二维码关注公众号</p>
  <img class="qr-img" src="images/qrcode-wechat.jpg" alt="公众号二维码">
  <p class="qr-tip">长按二维码识别即可关注</p>
  <a class="back" href="index.html">返回官网首页</a>
</div>
</body>
</html>
